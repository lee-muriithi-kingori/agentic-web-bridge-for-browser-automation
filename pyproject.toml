[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webbridge"
version = "4.2.0"
description = "Local-first browser automation bridge — AI agents drive your real Chrome/Edge via CDP, pinned to ONE tab. Auth, long-poll, MCP server, OS-level input."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["browser", "automation", "cdp", "chrome", "ai-agent", "local-first", "llm", "vision"]

[project.optional-dependencies]
# `pip install webbridge[os]` enables the /os endpoint (OS-level mouse/keyboard via pyautogui).
# Without it, the bridge is CDP-only (drives the browser tab; can't do native dialogs).
os = ["pyautogui>=0.9.54"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/lee-muriithi-kingori/agentic-web-bridge-for-browser-automation"
Repository = "https://github.com/lee-muriithi-kingori/agentic-web-bridge-for-browser-automation"

[project.scripts]
webbridge = "webbridge.__main__:main"
webbridge-server = "webbridge.server:main"
webbridge-client = "webbridge.client:main"
webbridge-mcp = "webbridge.mcp:main"

[tool.setuptools.packages.find]
include = ["webbridge*"]
