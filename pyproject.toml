[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "webbridge"
version = "3.2.0"
description = "Local-first browser automation bridge — AI agents drive your real Chrome/Edge via CDP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["browser", "automation", "cdp", "chrome", "ai-agent", "local-first"]

[project.urls]
Homepage = "https://github.com/lee-muriithi-kingori/agentic-web-bridge-for-browser-automation"
Repository = "https://github.com/lee-muriithi-kingori/agentic-web-bridge-for-browser-automation"

[project.scripts]
webbridge = "webbridge.__main__:main"
webbridge-server = "webbridge.server:main"
webbridge-client = "webbridge.client:main"

[tool.setuptools.packages.find]
include = ["webbridge*"]
