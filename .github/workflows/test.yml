name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest tests/test_server.py tests/test_client.py -v --tb=short

      - name: Verify entry points import cleanly
        run: |
          python -c "from webbridge import __version__; print('version:', __version__)"
          python -c "from webbridge.server import main, Bridge, Handler, Server; print('server imports ok')"
          python -c "from webbridge.client import main, send_command, build_parser; print('client imports ok')"
          python -c "from webbridge.mcp import main, TOOLS; print('mcp imports ok, tools:', len(TOOLS))"

      - name: Verify CLI parses help (no crash)
        run: |
          python -m webbridge.client --help
